dataset:
  type: scannetpp
  root: maskclustering/data
  splits_file: maskclustering/splits/scannetpp.txt

model:
  # Main model used for original / context images
  original:
    name: qwen2.5vl:7b
    backend: ollama
    quantize: false

  # Model dedicated to the highlighted (masked) object crops
  highlighted:
    name: nvidia/DAM-3B-Self-Contained
    backend: dam
    quantize: false

  # Model used for caption merging
  merging:
    name: gemma3:4b-it-qat
    backend: ollama
    quantize: false

inference:
  output_dir: vlm_caption/outputs
  debug: true
  seq_names: []
  num_best_views: 3
